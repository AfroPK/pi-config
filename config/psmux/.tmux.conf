# Extended keys: lets TUIs (Pi, Neovim) receive modified Enter, Ctrl+Enter, Shift+Enter.
# psmux 3.4.0 accepts and stores these but does not implement them yet (no key-mode
# machinery in the binary), so modified Enter still won't reach Pi until psmux adds it.
# The options are already correct for the version that does; keep them.
set -g extended-keys on
set -g extended-keys-format csi-u

# Disable background __warm__ standby server so exiting tmux leaves no lingering processes
set -g warm off

# Use PowerShell 7 (faster, cached profile) instead of Windows PowerShell 5.1
set -g default-shell pwsh

# Enable mouse support (scrolling, pane selection, resizing)
set -g mouse on
